/* TCG MACHINES · Official orange/gray/charcoal brand system · v1.1 */
:root{color-scheme:dark;--bg:#0b0c0d;--panel:#17191b;--panel2:#202225;--line:#36383b;--muted:#a6a8ab;--brand:#ff881f;--good:#55d79c;--warn:#ffb447;--bad:#ff776f}
body{background:#0b0c0d;color:#e9e9e9}
.app{background:radial-gradient(ellipse 50% 31% at 90% 0%,rgba(255,136,31,.075),transparent 70%),#0c0d0f}
.sidebar{background:linear-gradient(160deg,#090a0b 0%,#141517 76%,#0b0c0d 100%);border-right:1px solid #343434;width:254px;padding:20px 13px 18px;gap:20px}
.brand{padding:0 9px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:13px;border-bottom:1px solid #363331}
.brand-logo{display:block;object-fit:contain;object-position:left center;width:100%;max-width:216px;height:auto;aspect-ratio:1024/293;filter:drop-shadow(0 3px 10px rgba(0,0,0,.45))}
.brand-caption{display:flex;flex-direction:column;gap:3px;padding-left:2px}
.brand-caption strong{font-size:13px;letter-spacing:1.4px;font-weight:800;color:#ededed}
.brand-caption small{color:#ff9e4b;font-size:9px;font-weight:800;letter-spacing:.55px;line-height:1.5}
.nav{gap:5px}
.nav button{color:#b9babb;border:1px solid transparent;border-radius:8px;transition:background .15s,border-color .15s;min-height:43px;font-size:13px}
.nav button:hover{color:white;background:#25211e;border-color:#55412d}
.nav button.active{color:#fff2e7;background:linear-gradient(90deg,#643915 0%,#3b291c 100%);border-color:#c46a1c;box-shadow:inset 3px 0 #ff921c}
.nav .ico{color:#fb923c;font-size:19px}
.sidebar-foot{background:#161718;border:1px solid #333538;color:#aaa;border-radius:9px}
.sidebar-foot b{color:#ff9a3d;letter-spacing:.6px}
.main{padding:25px 26px 38px}
.topline{border:1px solid #383838;border-left:4px solid var(--brand);border-radius:12px;background:linear-gradient(108deg,#202020 0%,#121315 68%);padding:17px 20px;margin-bottom:18px;align-items:center;box-shadow:0 8px 22px rgba(0,0,0,.14)}
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#ff973b;font-size:10px;letter-spacing:1.35px}
.eyebrow-dot{display:inline-block;height:8px;width:8px;border-radius:50%;background:#ff881f;box-shadow:0 0 0 3px rgba(255,136,31,.12)}
.eyebrow-divider{color:#828282;font-size:14px;font-weight:400}
.pilot-pill{font-size:9px;letter-spacing:1px;color:#c5c5c5;border:1px solid #555;border-radius:4px;padding:3px 6px;margin-left:2px}

h2,h3{color:#f0f0f0}

.btn:hover{background:#38302a;color:#fff;border-color:#ff881f}
.btn.ghost{background:#1e2022}
.btn.primary{background:#ff881f;color:#111;font-weight:850;border-color:#ff881f}
.btn.primary:hover{background:#ffa347;border-color:#ffa347;color:#111}
.kpis{gap:10px;margin-bottom:16px}
.kpi{background:linear-gradient(144deg,#212224 0%,#151617 86%);border:1px solid #414141;border-top:2px solid #7a491f;border-radius:10px;padding:15px 16px}
.kpi .klabel{color:#c1c1c1;font-size:10px}

.kpi .small{color:#a3a4a7}
.panel{background:#181a1c;border:1px solid #3b3c3f;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.10)}

.ph p{color:#b5b5b5}

</style></head><body>
<div id="app"></div><div id="tvRoot" class="tv"></div><a href="/logout" class="server-logout" aria-label="Sign out of TCG Skills and Roles">Sign out</a><dialog id="modal" class="modal"></dialog><div id="toast" class="toast" hidden></div>
<script>const BOOT_DATA={"version":1,"skills":[],"roles":[],"employees":[],"awards":{},"trainingRequests":[],"audit":[]};</script>
<script>
'use strict';
const MODULES=['Scanner','Conveyor','Chassis'];
const CATEGORIES=['Inventory','3D Printing Procedures','Sub-Assemblies','Main Assembly','Refurb Procedures','QC & Pre-Testing','Testing Skills','Shipping & Logistics'];
const PREFIXES=['INASS','SA','SSA','CAB','MA'];
const ST={unchecked:'Not checked',missing:'Missing',draft:'Draft',approved:'Approved'};
const ICONS={matrix:'▦',roles:'⇄',sops:'▤',training:'★',people:'♙',tv:'▣'};
const clone=x=>JSON.parse(JSON.stringify(x));
let data=clone(BOOT_DATA); // Replaced with server data when the local host connects.
let ui={tab:'matrix',q:'',module:'All modules',category:'All departments',prefix:'All prefixes',tv:false,tvAuto:true,tvScale:12,roleSearch:'',sopFilter:'All SOP statuses'};
let scrollTimer=null,dragState=null;
const el=(id)=>document.getElementById(id);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const genId=(k)=>`${k}:${Date.now()}:${Math.random().toString(36).slice(2,8)}`;
// One shared server file on the Railway volume, with revision-based conflict checks.
let serverRevision=null, serverReady=false, editGeneration=0, savedGeneration=0;
let uploadRunning=false, conflictDetected=false, retryTimeout=null, pollingRunning=false, warnedOffline=false;
function persist(){
  if(!serverReady)return;
  editGeneration++;
  clearTimeout(retryTimeout);
  retryTimeout=setTimeout(saveToServer,180);
}
async function saveToServer(){
  if(!serverReady||uploadRunning||conflictDetected||editGeneration===savedGeneration)return;
  const generation=editGeneration, snapshot=clone(data);
  uploadRunning=true;
  try{
    const response=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:serverRevision,state:snapshot}),cache:'no-store'});
    if(response.status===409){
      conflictDetected=true;
      alert('Another device updated the matrix while you were editing. Your unsaved changes are preserved in this browser. Use Export Backup first if needed, then reload the page to see the latest shared data.');
      return;
    }
    if(!response.ok)throw new Error('HTTP '+response.status);
    const result=await response.json();
    serverRevision=result.revision;savedGeneration=generation;warnedOffline=false;
  }catch(e){
    if(!warnedOffline){toast('Unable to save to the server. Keep this page open and check the connection before leaving.',true);warnedOffline=true;}
  }finally{
    uploadRunning=false;
    if(!conflictDetected&&editGeneration!==savedGeneration){clearTimeout(retryTimeout);retryTimeout=setTimeout(saveToServer,1500)}
  }
}
async function pollServer(){
  if(!serverReady||pollingRunning||uploadRunning||editGeneration!==savedGeneration||conflictDetected)return;
  if(document.querySelector('#modal')?.open)return;
  pollingRunning=true;
  try{
    const response=await fetch('/api/state',{cache:'no-store'});
    if(!response.ok)throw new Error('Server unavailable');
    const result=await response.json();
    if(result.revision!==serverRevision && result.state && Array.isArray(result.state.skills)){
      // Protect a locally edited state if it changed while the network request was running.
      if(editGeneration!==savedGeneration || uploadRunning)return;
      serverRevision=result.revision;data=result.state;
      render();
    }
  }catch(e){}finally{pollingRunning=false}
}
async function startLocalApp(){
  el('app').innerHTML='<div style="max-width:690px;margin:13vh auto;padding:30px;border:1px solid #555;border-top:4px solid #ff881f;border-radius:12px;background:#1b1b1b;color:#eee;font:16px Arial,sans-serif"><h1>TCG Skills &amp; Roles Matrix</h1><p>Connecting to the TCG Skills & Roles server…</p><p style="color:#aaa;font-size:13px">Changes are stored on the shared server, not in this browser.</p></div>';
  try{
    const response=await fetch('/api/state',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const result=await response.json();
    if(!result.state||!Array.isArray(result.state.skills)||!Array.isArray(result.state.roles))throw new Error('Invalid local server data');
    data=result.state;serverRevision=result.revision;serverReady=true;
    if(location.hash.toLowerCase()==='#tv')ui.tv=true;
    render();
    setInterval(pollServer,3000);
  }catch(err){
    el('app').innerHTML='<div style="max-width:690px;margin:13vh auto;padding:30px;border:1px solid #555;border-top:4px solid #ff881f;border-radius:12px;background:#1b1b1b;color:#eee;font:16px Arial,sans-serif"><h1>TCG Skills &amp; Roles Matrix</h1><p><b>Server not connected.</b></p><p>Check the server connection or refresh the page. Your unsaved work may be lost if you reload.</p><p style="color:#aaa;font-size:13px">Details: '+String(err.message).replace(/[<>]/g,'')+'</p><p><a style="color:#ff9e41" href="/">Try again</a></p></div>';
  }
}

function toast(t,bad=false){const e=el('toast');e.textContent=t;e.style.background=bad?'#61302b':'#244234';e.hidden=false;setTimeout(()=>e.hidden=true,3300)}
function log(event){data.audit.unshift({event,date:new Date().toISOString()});if(data.audit.length>200)data.audit=data.audit.slice(0,200)}
function person(id){return data.employees.find(x=>x.id===id)}
function skill(id){return data.skills.find(x=>x.id===id)}
function role(id){return data.roles.find(x=>x.id===id)}
function awarded(employeeId,skillId){return data.awards[employeeId+'|'+skillId]||null}
function pending(employeeId,skillId){return data.trainingRequests.some(q=>q.employeeId===employeeId&&q.skillId===skillId&&q.status==='pending')}
function coverage(r,employeeId){if(!employeeId)return {have:0,total:r.skillIds.length,unassigned:true};let have=0;for(const sid of r.skillIds)if(awarded(employeeId,sid))have++;return{have,total:r.skillIds.length,unassigned:false}}
function reqStatus(r,employeeId){const c=coverage(r,employeeId);if(c.unassigned)return 'Unassigned';if(c.total===0)return 'No required skills';if(c.have===c.total)return 'Qualified';return `⚠ ${c.total-c.have} untrained`}
function pct(r,employeeId){const c=coverage(r,employeeId);return c.total?Math.round(c.have/c.total*100):0}
const chip=(v,kind='')=>`<span class="pill ${kind}">${esc(v)}</span>`;
const sopBadge=s=>chip(ST[s.sop]||'Not checked',s.sop==='approved'?'good':s.sop==='missing'?'bad':s.sop==='draft'?'warn':'muted');
function filteredSkills(all=false){return data.skills.filter(s=>(all||ui.module==='All modules'||s.module===ui.module)&&(all||ui.category==='All departments'||s.category===ui.category)&&(all||ui.prefix==='All prefixes'||s.prefix===ui.prefix)&&(all||!ui.q||[s.name,s.part,s.module,s.category,s.prefix].join(' ').toLowerCase().includes(ui.q.toLowerCase())))}
function option(v,cur){return `<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`}
function header(){return `<aside class="sidebar"><div class="brand"><img class="brand-logo" alt="TCG Machines" src="/TCG_Machines_Logo.png"><div class="brand-caption"><strong>SKILLS &amp; ROLES MATRIX</strong><small>PRODUCTION CAPABILITY · BOM PILOT</small></div></div><nav class="nav">${[['matrix','Skills matrix'],['roles','Roles & duties'],['sops','SOP tracker'],['training','Training log'],['people','Employees']].map(([id,n])=>`<button data-action="tab" data-tab="${id}" class="${ui.tab===id?'active':''}"><span class="ico">${ICONS[id]}</span>${n}</button>`).join('')}<button data-action="tv"><span class="ico">▣</span>Full-screen TV</button></nav><div class="sidebar-foot"><b>BOM-FIRST DRAFT</b><br>Only INASS, SA, SSA, CAB and MA entries were used to generate candidate skills. No employee is considered qualified until approved and given a gold star.<br><br>Changes are saved to the shared server. Export backups before major changes.</div></aside>`}
function titleBlock(){const titles={matrix:['Skills qualification matrix','BOM-based skills, competency stars, and assigned roles displayed together.'],roles:['Roles & responsibilities','Drag employees into roles. Drag a skill from the library onto a role to add a requirement.'],sops:['SOP coverage tracker','Unchecked SOPs are not necessarily missing; verify each item before marking it required.'],training:['Training & sign-offs','Gold stars require independent competency and approval.'],people:['Employee directory','Add or edit employees. No imported employee qualifications are assumed.']};return `<div class="topline"><div><div class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span> TCG MACHINES <span class="eyebrow-divider">/</span> PRODUCTION OPERATIONS <span class="pilot-pill">BOM PILOT</span></div><h1>${titles[ui.tab][0]}</h1><div class="sub">${titles[ui.tab][1]}</div></div><div class="actions"><button class="btn ghost" data-action="export">↓ Export backup</button><button class="btn ghost" data-action="import">↑ Import backup</button><button class="btn primary" data-action="tv">▣ TV view</button></div></div>`}
function kpis(){let qualified=Object.keys(data.awards).length,missing=data.skills.filter(s=>s.sop==='missing').length,unknown=data.skills.filter(s=>s.sop==='unchecked').length,untrained=data.roles.filter(r=>r.primary&&reqStatus(r,r.primary)!=='Qualified').length;return `<section class="kpis"><div class="kpi"><div class="klabel">BOM skill candidates</div><div class="num">${data.skills.length}</div><div class="small">${new Set(data.skills.filter(s=>s.part).map(s=>s.part)).size} unique part codes</div></div><div class="kpi"><div class="klabel">Verified gold stars</div><div class="num" style="color:var(--brand)">${qualified}</div><div class="small">${data.employees.length} employee(s)</div></div><div class="kpi"><div class="klabel">Assigned role gaps</div><div class="num" style="color:var(--bad)">${untrained}</div><div class="small">${data.roles.length} editable role groups</div></div><div class="kpi"><div class="klabel">SOPs to verify / missing</div><div class="num">${unknown} <span style="font-size:15px;color:var(--muted)">/</span> <span style="color:var(--bad)">${missing}</span></div><div class="small">Unknown / confirmed missing</div></div></section>`}
function filters(){return `<div class="toolbar"><input class="input search" id="q" value="${esc(ui.q)}" placeholder="Search part, skill or code" aria-label="Search skills"><select class="select" id="filter-module">${['All modules',...MODULES].map(v=>option(v,ui.module)).join('')}</select><select class="select" id="filter-category">${['All departments',...CATEGORIES].map(v=>option(v,ui.category)).join('')}</select><select class="select" id="filter-prefix">${['All prefixes',...PREFIXES,'Custom'].map(v=>option(v,ui.prefix)).join('')}</select><button class="btn sm primary" data-action="addSkill">+ Add skill</button></div>`}
function skillRows(skills){let out='',prev='';for(const s of skills){const g=s.category+' / '+(s.module||'General')+' / '+(s.prefix||'Custom');if(g!==prev){out+=`<tr class="grouprow"><td colspan="${3+data.employees.length}">${esc(g)}</td></tr>`;prev=g}out+=`<tr><td class="skillcol"><div class="code draggable" draggable="true" data-drag-skill="${esc(s.id)}">⠿ ${esc(s.part||'CUSTOM')} · ${esc(s.prefix||'Custom')}</div><span class="skillname">${esc(s.name)}</span><div class="skillmeta">${s.provisional?chip('Grouping needs review','warn'):''}<button class="statusbtn" data-action="editSkill" data-id="${esc(s.id)}">Edit / move</button></div></td><td><button class="statusbtn" data-action="editSop" data-id="${esc(s.id)}">${sopBadge(s)}</button></td><td><span class="code">${esc((s.paths||[]).join(', ')||'—')}</span></td>${data.employees.map(e=>`<td class="score"><button class="cell ${awarded(e.id,s.id)?'star':pending(e.id,s.id)?'pending':''}" title="${esc(e.name)} — ${esc(s.part)}" data-action="qualification" data-skill="${esc(s.id)}" data-emp="${esc(e.id)}">${awarded(e.id,s.id)?'★':pending(e.id,s.id)?'◉':'−'}</button></td>`).join('')}</tr>`}
return out||`<tr><td colspan="${3+data.employees.length}" class="empty">No matching skills. Change a filter or add a skill.</td></tr>`}
function matrixTable(list){return `<div class="matrixwrap"><table class="matrix"><thead><tr><th class="skillcol">Procedure / competency</th><th>SOP</th><th>BOM path</th>${data.employees.map(e=>`<th class="emph">${esc(e.name)}</th>`).join('')}</tr></thead><tbody>${skillRows(list)}</tbody></table></div>`}
function roleList(rlist,compact=true){return rlist.map(r=>{let c=coverage(r,r.primary);return `<div class="roleitem" data-role-drop="${esc(r.id)}"><div class="role-line"><div class="role-title">${esc(r.name)}</div><button class="btn sm ghost" data-action="editRole" data-id="${esc(r.id)}">Edit</button></div><div class="role-copy">${esc(r.module||'General')} · ${r.skillIds.length} required skills</div><div class="role-line"><span class="hint">Primary</span><span style="font-size:10px;color:${c.unassigned?'var(--muted)':c.have===c.total?'var(--good)':'var(--bad)'}">${esc(reqStatus(r,r.primary))}</span></div><div class="assign" data-drop-role="${esc(r.id)}" data-slot="primary">${r.primary?`<span class="assigned">${esc(person(r.primary)?.name||'Former employee')}</span>`:'Drag employee here'}</div><div class="progress"><span style="width:${pct(r,r.primary)}%;background:${c.total&&c.have===c.total?'var(--good)':'var(--warn)'}"></span></div>${!compact?`<div class="hint">Backup: ${esc(person(r.backup)?.name||'Not assigned')} · ${esc(reqStatus(r,r.backup))}</div>`:''}</div>`}).join('')}
function matrixView(){let skills=filteredSkills();return `<div class="workspace"><section class="panel"><div class="ph"><div><h2>Employee competency matrix</h2><p>★ = independently competent and verified · ◉ = training submitted · − = not verified</p></div><button class="btn sm" data-action="addEmployee">+ Employee</button></div><div class="pb">${filters()}</div>${data.employees.length?'':`<div class="notice warn" style="margin:0 16px 12px">No employees loaded yet. Add a person or load optional, clearly labeled example staff to see how gold stars and role warnings work. <button class="btn sm" data-action="demo">Load sample staff</button></div>`}${matrixTable(skills)}<div style="padding:12px 16px" class="hint">Showing ${skills.length} of ${data.skills.length} competencies · Drag skill labels into module or department cards below to change grouping.</div></section><aside class="panel"><div class="ph"><div><h2>Roles & responsibilities</h2><p>Drag an employee from the chips below onto a primary owner field.</p></div><button class="btn sm" data-action="addRole">+ Role</button></div><div class="pb"><div class="flexwrap">${data.employees.map(p=>`<span draggable="true" class="empchip" data-drag-emp="${esc(p.id)}">⠿ ${esc(p.name)}${p.sample?' (sample)':''}</span>`).join('')||'<span class="hint">Add employees to assign roles.</span>'}</div></div><div class="roles-list">${roleList(data.roles)}</div></aside></div><div class="sections">${CATEGORIES.map(cat=>{let n=data.skills.filter(s=>s.category===cat).length;return `<div class="section dropzone ${n?'':'zero'}" data-drop-category="${esc(cat)}"><div class="boxlabel">${esc(cat)}</div><div class="amount">${n}</div><small>${n?'Drag skill here to reclassify':'Ready for new skills'}</small></div>`}).join('')}</div>`}
function rolesView(){let q=ui.roleSearch.toLowerCase();let roles=data.roles.filter(r=>!q||[r.name,r.module,r.description].join(' ').toLowerCase().includes(q));return `<div class="panel"><div class="ph"><div><h2>Editable responsibilities & training requirements</h2><p>Assign primary / backup owners, then review required skills and warnings.</p></div><button class="btn primary" data-action="addRole">+ New role</button></div><div class="pb"><div class="toolbar"><input class="input search" id="role-search" value="${esc(ui.roleSearch)}" placeholder="Search roles"><span class="hint">Drag role cards to reorder · Drag a part from the skill library onto a role card.</span></div><div class="flexwrap" style="margin-top:14px">${data.employees.map(p=>`<div class="empchip" draggable="true" data-drag-emp="${esc(p.id)}">⠿ ${esc(p.name)}</div>`).join('')||'<span class="hint">Add employees before staffing roles.</span>'}</div><div class="gridtwo" style="margin-top:14px">${roles.map(r=>{let c=coverage(r,r.primary);return `<div class="rolecard dropzone" draggable="true" data-drag-role="${esc(r.id)}" data-role-drop="${esc(r.id)}"><div class="role-line"><div><div class="boxlabel">⠿ ${esc(r.module||'General')}</div><h3 style="margin-top:5px">${esc(r.name)}</h3></div><button class="btn sm" data-action="editRole" data-id="${esc(r.id)}">Edit</button></div><div class="role-copy">${esc(r.description)}</div><div class="divider"></div><div class="gridtwo" style="gap:7px"><div><div class="boxlabel" style="margin-bottom:6px">Primary owner</div><div class="assign" data-drop-role="${esc(r.id)}" data-slot="primary">${esc(person(r.primary)?.name||'Drop employee')}</div></div><div><div class="boxlabel" style="margin-bottom:6px">Backup owner</div><div class="assign" data-drop-role="${esc(r.id)}" data-slot="backup">${esc(person(r.backup)?.name||'Drop employee')}</div></div></div><div class="role-line" style="margin-top:12px"><span class="hint">${r.skillIds.length} skill requirement(s)</span><span style="color:${c.unassigned?'var(--muted)':c.have===c.total?'var(--good)':'var(--bad)'};font-size:11px;font-weight:700">${esc(reqStatus(r,r.primary))}</span></div><div class="progress"><span style="width:${pct(r,r.primary)}%;background:${c.total&&c.have===c.total?'var(--good)':'var(--warn)'}"></span></div><div class="hint">Drop an individual skill here to add it to this role.</div></div>`}).join('')}</div></div></div><div class="panel" style="margin-top:16px"><div class="ph"><div><h2>Drag-and-drop skill library</h2><p>Drag a part onto a role card above to link it as a required skill.</p></div></div><div class="pb">${data.skills.slice(0,200).map(s=>`<span class="empchip" style="font-size:10px;margin:3px;max-width:280px" title="${esc(s.name)}" draggable="true" data-drag-skill="${esc(s.id)}">⠿ ${esc(s.part||'Custom')} · ${esc(s.module||'General')}</span>`).join('')}</div></div>`}
function sopsView(){const unlinked=data.skills.filter(s=>s.sop==='unchecked');const missing=data.skills.filter(s=>s.sop==='missing');const drafts=data.skills.filter(s=>s.sop==='draft');const approved=data.skills.filter(s=>s.sop==='approved');let skills=data.skills.filter(s=>ui.sopFilter==='All SOP statuses'||s.sop===ui.sopFilter);return `<div class="gridthree"><div class="kpi"><div class="klabel">Unverified SOP coverage</div><div class="num">${unlinked.length}</div><div class="small">Needs status verification, not necessarily creation</div></div><div class="kpi"><div class="klabel">Confirmed missing · required SOPs</div><div class="num" style="color:var(--bad)">${missing.length}</div><div class="small">Automatically listed below</div></div><div class="kpi"><div class="klabel">Draft / approved</div><div class="num">${drafts.length} / <span style="color:var(--good)">${approved.length}</span></div><div class="small">Track readiness</div></div></div><section class="panel" style="margin-top:16px"><div class="ph"><div><h2>Required SOPs & status verification</h2><p>Select a part to mark its status and attach an SOP link. Only confirmed missing items appear on the required list.</p></div><select class="select" id="sop-filter">${['All SOP statuses',...Object.keys(ST)].map(v=>option(v,ui.sopFilter)).join('')}</select></div><div class="table-scroll"><table class="listtable"><thead><tr><th>Part / proposed skill</th><th>Area</th><th>Status</th><th>Action</th></tr></thead><tbody>${skills.map(s=>`<tr><td><div class="code">${esc(s.part)}</div><b>${esc(s.name)}</b></td><td>${esc(s.module)} · ${esc(s.prefix)}</td><td>${sopBadge(s)}</td><td><button class="btn sm" data-action="editSop" data-id="${esc(s.id)}">Update</button>${s.sopLink?` <a target="_blank" rel="noopener noreferrer" href="${esc(s.sopLink)}">Open SOP</a>`:''}</td></tr>`).join('')}</tbody></table></div></section><div class="panel" style="margin-top:16px"><div class="ph"><h2>Confirmed missing SOP queue (${missing.length})</h2></div><div class="pb">${missing.length?missing.map(s=>`<div class="statline"><span>${esc(s.module)} · <b>${esc(s.part)}</b> — ${esc(s.name)}</span><button class="btn sm" data-action="editSop" data-id="${esc(s.id)}">Update</button></div>`).join(''):'<div class="empty">No SOPs have been confirmed missing yet. Imported BOM parts start as “Not checked,” because the BOM contains no SOP documentation fields.</div>'}</div></div>`}
function trainingView(){const pendingRequests=data.trainingRequests.filter(r=>r.status==='pending');return `<section class="panel"><div class="ph"><div><h2>New skill training submissions</h2><p>A gold star is issued only after an authorized signer confirms the person can perform the task independently.</p></div><button class="btn primary" data-action="submitTraining">+ Submit training update</button></div><div class="pb">${pendingRequests.length?pendingRequests.map(r=>`<div class="statline"><div><b>${esc(person(r.employeeId)?.name||'Unknown')}</b> · ${esc(skill(r.skillId)?.part||'Skill removed')} — ${esc(skill(r.skillId)?.name||'')}<div class="hint">Submitted ${esc(r.date)} · Trainer: ${esc(r.trainer||'Not entered')}</div></div><div class="actions"><button class="btn sm primary" data-action="approveTraining" data-id="${esc(r.id)}">Approve</button><button class="btn sm" data-action="rejectTraining" data-id="${esc(r.id)}">Reject</button></div></div>`).join(''):'<div class="empty">No outstanding skill requests. Employees or managers can submit new training here.</div>'}</div></section><section class="panel" style="margin-top:16px"><div class="ph"><h2>Training sign-off history</h2></div><div class="pb">${data.audit.length?data.audit.map(v=>`<div class="audititem">${esc(v.event)}<div class="hint">${new Date(v.date).toLocaleString()}</div></div>`).join(''):'<div class="empty">No sign-offs yet.</div>'}</div></section>`}
function peopleView(){return `<div class="panel"><div class="ph"><div><h2>Employee roster</h2><p>All new employees start with no verified skills.</p></div><div class="actions"><button class="btn" data-action="demo">Load sample employees</button><button class="btn primary" data-action="addEmployee">+ Add employee</button></div></div><div class="pb"><div class="gridthree">${data.employees.map(e=>{let n=Object.keys(data.awards).filter(k=>k.startsWith(e.id+'|')).length;return `<div class="rolecard"><div class="role-line"><b>${esc(e.name)}</b><button class="btn sm" data-action="editEmployee" data-id="${esc(e.id)}">Edit</button></div><div class="hint">${esc(e.title||'Production staff')}${e.sample?' · Sample entry':''}</div><div style="font-size:23px;color:var(--brand);margin-top:8px">★ ${n}</div><div class="hint">independent skills verified</div></div>`}).join('')}</div>${data.employees.length?'':'<div class="empty">No employees in the prototype. Add employees to activate the matrix.</div>'}</div></div><div class="panel" style="margin-top:15px"><div class="ph"><h2>Data management</h2></div><div class="pb"><p class="sub">All app changes stay in this browser. Export a JSON file to save employee sign-offs, role assignments and SOP status outside this device. The BOM mapping CSV is included with the downloadable package.</p><div class="actions" style="margin-top:13px"><button class="btn primary" data-action="export">↓ Export JSON backup</button><button class="btn" data-action="import">↑ Import JSON backup</button><button class="btn danger" data-action="reset">Reset to original BOM draft</button></div></div></div>`}
function render(){el('app').innerHTML=`<div class="app">${header()}<main class="main"><div class="local-test-note">◉ SHARED SKILLS SERVER &nbsp; • &nbsp; Changes saved to persistent storage &nbsp; • &nbsp; Connected devices refresh automatically</div>${titleBlock()}${kpis()}${({matrix:matrixView,roles:rolesView,sops:sopsView,training:trainingView,people:peopleView})[ui.tab]()}</main></div>`;if(ui.tv)renderTV()}
function modalShell(title,body){const m=el('modal');m.innerHTML=`<div class="mh"><h2>${esc(title)}</h2><button class="btn sm" data-action="closeModal">× Close</button></div><div class="mb">${body}</div>`;m.showModal()}
function field(label,name,value='',kind='text',extra=''){return `<label class="field">${esc(label)}<input class="input" name="${esc(name)}" type="${kind}" value="${esc(value)}" ${extra}></label>`}
function selectField(label,name,items,current){return `<label class="field">${esc(label)}<select class="select" name="${esc(name)}">${items.map(v=>option(v,current)).join('')}</select></label>`}
function formButtons(remove=false){return `<div class="form-actions">${remove?'<button class="btn danger" name="intent" value="delete" type="submit" formnovalidate>Delete</button>':''}<button type="button" class="btn" data-action="closeModal">Cancel</button><button class="btn primary" type="submit">Save</button></div>`}
function openSkill(id=''){const s=skill(id),isEdit=!!s;modalShell(isEdit?'Edit / move competency':'Add new competency',`<form id="skill-form" data-id="${esc(id)}"><div class="formgrid">${field('Skill / procedure name','name',s?.name||'','text','required')}${field('BOM part no. (optional)','part',s?.part||'')}${selectField('Department','category',CATEGORIES,s?.category||'Sub-Assemblies')}${selectField('Module','module',['Scanner','Conveyor','Chassis','General'],s?.module||'Scanner')}${selectField('Prefix / type','prefix',[...PREFIXES,'Custom'],s?.prefix||'Custom')}<label class="field">SOP status<select class="select" name="sop">${Object.keys(ST).map(v=>`<option value="${v}" ${v===(s?.sop||'unchecked')?'selected':''}>${ST[v]}</option>`).join('')}</select></label><label class="field span2">Skill criteria / notes<textarea class="textarea" name="notes">${esc(s?.notes||'')}</textarea></label></div>${s?.paths?.length?`<p class="formhint">BOM path(s): ${esc(s.paths.join(', '))}. Part provenance remains attached when moved.</p>`:''}${formButtons(isEdit)}</form>`)}
function openEmployee(id=''){const p=person(id);modalShell(p?'Edit employee':'Add employee',`<form id="employee-form" data-id="${esc(id)}"><div class="formgrid">${field('Employee name','name',p?.name||'','text','required')}${field('Job title / department (optional)','title',p?.title||'')}</div>${formButtons(!!p)}</form>`)}
function openRole(id=''){const r=role(id);modalShell(r?'Edit role / required skills':'Create new responsibility',`<form id="role-form" data-id="${esc(id)}"><div class="formgrid">${field('Role or responsibility name','name',r?.name||'','text','required')}${selectField('Module','module',['Scanner','Conveyor','Chassis','General'],r?.module||'Scanner')}${selectField('Department','department',CATEGORIES,r?.department||'Sub-Assemblies')}${selectField('Primary owner','primary',['',...data.employees.map(e=>e.id)],r?.primary||'')}${selectField('Backup owner','backup',['',...data.employees.map(e=>e.id)],r?.backup||'')}<label class="field span2">Responsibility description<textarea name="description" class="textarea">${esc(r?.description||'')}</textarea></label></div><div class="divider"></div><div class="boxlabel" style="margin-bottom:8px">Linked required competencies <span class="muted">(${r?.skillIds.length||0} selected)</span></div><input class="input" style="width:100%;margin-bottom:8px" id="role-skill-filter" placeholder="Find skill by code or description"><div class="checkbox-list" id="role-skill-list">${data.skills.map(s=>`<label class="checkrow"><input type="checkbox" name="skillIds" value="${esc(s.id)}" ${r?.skillIds.includes(s.id)?'checked':''}><span><b>${esc(s.part||'Custom')}</b> ${esc(s.name)} <span class="muted">· ${esc(s.module)}</span></span></label>`).join('')}</div>${formButtons(!!r)}</form>`);const sel=el('modal').querySelectorAll('select[name="primary"],select[name="backup"]');for(const e of sel){e.innerHTML=`<option value="">Not assigned</option>`+data.employees.map(p=>`<option value="${esc(p.id)}" ${e.name in (r||{})&&r[e.name]===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}}
function openSop(id){const s=skill(id);if(!s)return;modalShell('SOP status · '+s.part,`<p class="sub" style="margin-top:0"><b>${esc(s.name)}</b> · ${esc(s.module)} · ${esc(s.prefix)}</p><div class="notice warn">The BOM does not provide SOP references. “Not checked” means coverage is unknown; “Missing” adds this item to Required SOPs.</div><form id="sop-form" data-id="${esc(id)}" style="margin-top:13px"><div class="formgrid">${selectField('SOP status','sop',Object.keys(ST),s.sop)}${field('SOP URL / shared file link','sopLink',s.sopLink||'','url','placeholder="https://..."')}<label class="field span2">Notes<textarea name="sopNotes" class="textarea">${esc(s.sopNotes||'')}</textarea></label></div>${formButtons(false)}</form>`)}
function openQualification(employeeId,skillId){const p=person(employeeId),s=skill(skillId),a=awarded(employeeId,skillId);if(!p||!s)return;modalShell('Independent competency sign-off',`<div class="notice"><b>${esc(p.name)}</b> · ${esc(s.part)} — ${esc(s.name)}<br><span class="muted">Gold star = assessed and able to complete this work without direct supervision.</span></div><form id="qualification-form" data-emp="${esc(employeeId)}" data-skill="${esc(skillId)}" style="margin-top:14px"><div class="formgrid">${field('Approved by / assessor','assessor',a?.assessor||'','text','required')}${field('Qualification date','date',a?.date||new Date().toISOString().slice(0,10),'date','required')}<label class="field span2">Evidence / practical assessment notes<textarea name="evidence" class="textarea">${esc(a?.evidence||'')}</textarea></label></div><label class="checkrow" style="margin-top:10px"><input name="independent" type="checkbox" required ${a?'checked':''}>I confirm this employee is fully trained and can perform this task independently.</label><div class="form-actions">${a?'<button class="btn danger" name="intent" value="revoke" formnovalidate type="submit">Revoke star</button>':''}<button type="button" class="btn" data-action="closeModal">Cancel</button><button class="btn primary" type="submit">★ ${a?'Update sign-off':'Award gold star'}</button></div></form>`)}
function openTraining(){modalShell('Submit a new skill training request',`<p class="formhint">Requests do not award stars automatically. A manager must sign off on independent competence.</p><form id="training-form"><div class="formgrid"><label class="field">Employee<select name="employeeId" class="select" required>${data.employees.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></label><label class="field">Skill<select class="select" name="skillId" required>${data.skills.map(s=>`<option value="${esc(s.id)}">${esc(s.part)} — ${esc(s.name)}</option>`).join('')}</select></label>${field('Trainer (optional)','trainer')}${field('Training date','date',new Date().toISOString().slice(0,10),'date')}<label class="field span2">Training notes<textarea name="notes" class="textarea"></textarea></label></div>${formButtons(false)}</form>`)}
function approveRequest(id){const q=data.trainingRequests.find(x=>x.id===id);if(!q)return;openQualification(q.employeeId,q.skillId)}
function handleSubmit(e){if(!(e.target instanceof HTMLFormElement))return;e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f).entries()),intent=e.submitter?.value||'';const id=f.dataset.id;let msg='Saved';if(f.id==='skill-form'){let s=skill(id);if(intent==='delete'){if(!confirm('Delete this skill and remove it from all roles?'))return;data.skills=data.skills.filter(x=>x.id!==id);for(const r of data.roles)r.skillIds=r.skillIds.filter(x=>x!==id);for(const k of Object.keys(data.awards))if(k.endsWith('|'+id))delete data.awards[k];msg='Skill removed'}else if(s){Object.assign(s,{name:v.name.trim(),part:v.part.trim(),module:v.module,category:v.category,prefix:v.prefix,sop:v.sop,notes:v.notes});msg='Skill updated'}else{data.skills.push({id:genId('skill'),name:v.name.trim(),part:v.part.trim(),module:v.module,category:v.category,prefix:v.prefix,sop:v.sop,notes:v.notes,sopLink:'',paths:[],parents:[],bomRefs:[],provisional:false,source:'Added manually'});msg='Skill added'}}
else if(f.id==='employee-form'){const p=person(id);if(intent==='delete'){if(!confirm('Remove this employee? Past sign-off entries will be removed.'))return;data.employees=data.employees.filter(x=>x.id!==id);for(const r of data.roles){if(r.primary===id)r.primary='';if(r.backup===id)r.backup=''}for(const k of Object.keys(data.awards))if(k.startsWith(id+'|'))delete data.awards[k];msg='Employee removed'}else if(p){p.name=v.name.trim();p.title=v.title.trim();msg='Employee updated'}else{data.employees.push({id:genId('employee'),name:v.name.trim(),title:v.title.trim(),sample:false});msg='Employee added'}}
else if(f.id==='role-form'){const r=role(id);let ids=Array.from(f.querySelectorAll('input[name="skillIds"]:checked')).map(x=>x.value);if(intent==='delete'){if(!confirm('Delete this responsibility?'))return;data.roles=data.roles.filter(x=>x.id!==id);msg='Role removed'}else{let payload={name:v.name.trim(),module:v.module,department:v.department,description:v.description,primary:v.primary||'',backup:v.backup||'',skillIds:ids};if(r){Object.assign(r,payload);msg='Role updated'}else{data.roles.push({id:genId('role'),...payload});msg='Role added'}}}
else if(f.id==='sop-form'){const s=skill(id);if(s){s.sop=v.sop;s.sopLink=v.sopLink.trim();s.sopNotes=v.sopNotes;msg='SOP status saved'}}
else if(f.id==='qualification-form'){const emp=f.dataset.emp,sid=f.dataset.skill,key=emp+'|'+sid;if(intent==='revoke'){delete data.awards[key];msg='Qualification revoked';log(`${person(emp)?.name} · ${skill(sid)?.part}: gold star revoked`)}else if(v.independent==='on'&&v.assessor?.trim()){data.awards[key]={date:v.date,assessor:v.assessor.trim(),evidence:v.evidence||''};data.trainingRequests.forEach(q=>{if(q.employeeId===emp&&q.skillId===sid&&q.status==='pending')q.status='approved'});log(`${person(emp)?.name} earned ★ ${skill(sid)?.part}; approved by ${v.assessor.trim()}`);msg='Gold star awarded'}else{toast('An assessor and independent competency confirmation are required.',true);return}}
else if(f.id==='training-form'){if(!v.employeeId||!v.skillId){toast('Add an employee and skill first.',true);return}data.trainingRequests.push({id:genId('request'),...v,status:'pending'});log(`${person(v.employeeId)?.name} submitted training for ${skill(v.skillId)?.part}`);msg='Training request submitted'}
else return;persist();el('modal').close();render();toast(msg)}
function exportBackup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`TCG-Skills-Roles-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function importBackup(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const value=JSON.parse(await i.files[0].text());if(value.version!==1||!Array.isArray(value.skills)||!Array.isArray(value.roles))throw Error('Incorrect backup file');if(!confirm('Replace the entire shared matrix with this backup? This affects all connected devices. Export first if needed.'))return;data=value;persist();render();toast('Backup imported successfully')}catch(err){toast('Could not import backup: '+err.message,true)}};i.click()}
function addDemo(){if(!confirm('Add three DEMO-labeled employee records? No qualifications are assumed.'))return;for(const name of ['Demo · Alex','Demo · Taylor','Demo · Jordan']){if(!data.employees.some(x=>x.name===name))data.employees.push({id:genId('demo'),name,title:'Example employee',sample:true})}persist();render();toast('Sample roster loaded. Award stars manually to test.')}
function performAction(target){const a=target.dataset.action;if(!a)return;const id=target.dataset.id;switch(a){case'tab':ui.tab=target.dataset.tab;render();break;case'tv':ui.tv=true;renderTV();break;case'addSkill':openSkill();break;case'editSkill':openSkill(id);break;case'addRole':openRole();break;case'editRole':openRole(id);break;case'addEmployee':openEmployee();break;case'editEmployee':openEmployee(id);break;case'editSop':openSop(id);break;case'qualification':openQualification(target.dataset.emp,target.dataset.skill);break;case'export':exportBackup();break;case'import':importBackup();break;case'demo':addDemo();break;case'reset':if(confirm('Reset ALL shared edits and qualifications to the original BOM draft? This affects everyone. Export a backup first.')){fetch('/api/seed',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Seed unavailable');return r.json()}).then(seed=>{data=clone(seed);persist();render();toast('Original BOM draft restored on the shared server')}).catch(e=>toast('Unable to reset: '+e.message,true))}break;case'submitTraining':if(data.employees.length)openTraining();else toast('Add an employee first.',true);break;case'approveTraining':approveRequest(id);break;case'rejectTraining':{const q=data.trainingRequests.find(x=>x.id===id);if(q){q.status='rejected';log('Training request rejected for '+(person(q.employeeId)?.name||'Unknown'));persist();render()}}break;case'closeModal':el('modal').close();break;case'tvExit':exitTV();break;case'tvFS':toggleFullscreen();break;case'tvAuto':ui.tvAuto=!ui.tvAuto;renderTV();break;case'tvScaleDown':ui.tvScale=Math.max(9,ui.tvScale-1);renderTV();break;case'tvScaleUp':ui.tvScale=Math.min(21,ui.tvScale+1);renderTV();break;case'tvExport':exportBackup();break}}
function tvTable(){let prev='',rows='';for(const s of data.skills){const g=s.category+' / '+s.module+' / '+s.prefix;if(g!==prev){rows+=`<tr class="group"><td colspan="${2+data.employees.length}">${esc(g)}</td></tr>`;prev=g}rows+=`<tr><td><b class="code">${esc(s.part)}</b> ${esc(s.name)}</td><td>${s.sop==='approved'?'✓':s.sop==='missing'?'✕':s.sop==='draft'?'◷':'?'}</td>${data.employees.map(e=>`<td class="${awarded(e.id,s.id)?'tvstar':'tvdash'}">${awarded(e.id,s.id)?'★':pending(e.id,s.id)?'◉':'·'}</td>`).join('')}</tr>`}return `<table class="tvmatrix"><thead><tr><th>Skill / BOM procedure</th><th>SOP</th>${data.employees.map(e=>`<th>${esc(e.name)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`}
function renderTV(){clearInterval(scrollTimer);const t=el('tvRoot');t.classList.add('active');t.style.setProperty('--tv-font',ui.tvScale+'px');t.innerHTML=`<div class="tvhead"><div class="tv-header-title"><img class="tv-brand-logo" alt="TCG Machines" src="/TCG_Machines_Logo.png"><div class="tv-title-stack"><h1>SKILLS &amp; ROLES <em>TV VIEW</em></h1><div class="micro">PRODUCTION · TRAINING · QUALIFICATIONS <span class="tv-micro-sep">|</span> ★ independently qualified <span class="tv-micro-sep">|</span> ${data.skills.length} skills / ${data.roles.length} roles</div></div></div><div class="tvcontrols"><button class="btn" data-action="tvAuto">${ui.tvAuto?'◼ Pause scroll':'▶ Auto-scroll'}</button><button class="btn" data-action="tvScaleDown">A−</button><span class="micro">${ui.tvScale}px</span><button class="btn" data-action="tvScaleUp">A+</button><button class="btn" data-action="tvFS">⛶ Fullscreen</button><button class="btn primary" data-action="tvExit">× Exit</button></div></div><div class="tvcols"><section class="tvbox"><div class="tvboxhead"><span>ALL SKILLS · ${data.skills.length}</span><span class="tvhelp">Vertically scrolls to show entire list →</span></div><div class="tvscroll" id="tvSkillScroll">${tvTable()}</div></section><section class="tvbox"><div class="tvboxhead"><span>ALL ROLES · ${data.roles.length}</span><span class="tvhelp">Owner / training coverage</span></div><div class="tvscroll" id="tvRoleScroll">${data.roles.map(r=>{let c=coverage(r,r.primary);return `<div class="tvrole"><b>${esc(r.name)}</b><div class="meta">Primary: <strong>${esc(person(r.primary)?.name||'Unassigned')}</strong><br>Backup: ${esc(person(r.backup)?.name||'Unassigned')} · ${r.skillIds.length} required skills</div><span class="${c.unassigned||c.total&&c.have<c.total?'warn':'good'}">${esc(reqStatus(r,r.primary))}${!c.unassigned&&c.total?' · '+c.have+'/'+c.total+' verified':''}</span></div>`}).join('')}</div></section></div><div class="tvfoot"><span>★ Gold stars granted only after signed-off independent competency · Imported SOP status is unverified until checked</span><span><b>TCG MACHINES</b> · TV board · Auto-scroll cycles through all entries</span></div>`;if(ui.tvAuto){scrollTimer=setInterval(()=>{for(const id of ['tvSkillScroll','tvRoleScroll']){const e=el(id);if(!e)continue;let max=e.scrollHeight-e.clientHeight;if(max>0){if(e.scrollTop>=max-2)e.scrollTop=0;else e.scrollTop+=0.7}}},50)}}
function exitTV(){ui.tv=false;clearInterval(scrollTimer);el('tvRoot').classList.remove('active');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
function toggleFullscreen(){const t=el('tvRoot');if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}else if(t.requestFullscreen){t.requestFullscreen().catch(()=>toast('Fullscreen is not available in this browser.',true))}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn)performAction(btn)});
document.addEventListener('submit',handleSubmit);
document.addEventListener('change',e=>{if(e.target.id==='filter-module'){ui.module=e.target.value;render()}else if(e.target.id==='filter-category'){ui.category=e.target.value;render()}else if(e.target.id==='filter-prefix'){ui.prefix=e.target.value;render()}else if(e.target.id==='sop-filter'){ui.sopFilter=e.target.value;render()}});
let debounce;
document.addEventListener('input',e=>{if(e.target.id==='role-skill-filter'){const q=e.target.value.toLowerCase();for(const l of el('role-skill-list')?.children||[])l.hidden=!l.textContent.toLowerCase().includes(q);return}if(e.target.id==='q'||e.target.id==='role-search'){const id=e.target.id;const start=e.target.selectionStart;const value=e.target.value;clearTimeout(debounce);debounce=setTimeout(()=>{if(id==='q')ui.q=value;else ui.roleSearch=value;render();const elem=el(id);elem?.focus();try{elem?.setSelectionRange(start,start)}catch(e){}},280)}});
document.addEventListener('dragstart',e=>{const origin=e.target.closest('[data-drag-emp],[data-drag-skill],[data-drag-role]');if(!origin)return;dragState=origin.dataset.dragEmp?{type:'emp',id:origin.dataset.dragEmp}:origin.dataset.dragSkill?{type:'skill',id:origin.dataset.dragSkill}:{type:'role',id:origin.dataset.dragRole};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',JSON.stringify(dragState))});
document.addEventListener('dragover',e=>{const dest=e.target.closest('[data-drop-role],[data-drop-category],[data-role-drop]');if(!dest||!dragState)return;e.preventDefault();dest.classList.add('over')});
document.addEventListener('dragleave',e=>{const dest=e.target.closest('[data-drop-role],[data-drop-category],[data-role-drop]');if(dest)dest.classList.remove('over')});
document.addEventListener('drop',e=>{const dest=e.target.closest('[data-drop-role],[data-drop-category],[data-role-drop]');if(!dest)return;e.preventDefault();if(!dragState){try{dragState=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(er){return}}dest.classList.remove('over');const d=dragState;dragState=null;if(d.type==='emp'&&dest.dataset.dropRole){let r=role(dest.dataset.dropRole);if(r){r[dest.dataset.slot||'primary']=d.id;log(`${person(d.id)?.name} assigned to ${r.name} (${dest.dataset.slot||'primary'})`)}}else if(d.type==='skill'&&dest.dataset.dropCategory){let s=skill(d.id);if(s){s.category=dest.dataset.dropCategory;if(!['Sub-Assemblies','Main Assembly','Refurb Procedures','QC & Pre-Testing'].includes(s.category))s.module='General';log(`Moved ${s.part||s.name} to ${s.category}`)}}else if(d.type==='skill'&&dest.dataset.roleDrop){let r=role(dest.dataset.roleDrop);if(r&&!r.skillIds.includes(d.id)){r.skillIds.push(d.id);log(`Linked ${skill(d.id)?.part||'skill'} to ${r.name}`)}}else if(d.type==='role'&&dest.dataset.roleDrop){let start=data.roles.findIndex(r=>r.id===d.id),end=data.roles.findIndex(r=>r.id===dest.dataset.roleDrop);if(start>=0&&end>=0&&start!==end){let [item]=data.roles.splice(start,1);data.roles.splice(end,0,item)}}else return;persist();render();toast('Drag-and-drop change saved')});
document.addEventListener('dragend',()=>{dragState=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
el('modal').addEventListener('click',e=>{if(e.target===el('modal'))el('modal').close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.tv)exitTV()});
startLocalApp();
</script></body></html>
